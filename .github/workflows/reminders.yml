name: Recordatorios de pagos

# Llama al endpoint de la app cada hora. El endpoint decide a quién avisar
# según la hora elegida en cada pago (hora de Colombia).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Tolera espacios o "/" sobrantes al final de APP_URL.
          url=$(echo "$APP_URL" | tr -d '[:space:]')
          url="${url%/}/api/cron/reminders"
          echo "Host: $(echo "$url" | cut -d/ -f3)"
          body=$(curl --silent --show-error --max-time 60 \
            --write-out '\nHTTP %{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url")
          echo "Respuesta: $body"
          # Un redirect (login de Vercel) o un error no deben contar como éxito.
          echo "$body" | grep -q '"ok":true'
