name: Recordatorios de pagos

# Llama al endpoint de la app cada hora. El endpoint decide a quién avisar
# según la hora elegida en cada pago (hora de Colombia).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          body=$(curl --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders")
          echo "Respuesta: $body"
          # Un redirect (login de Vercel) o un error no deben contar como éxito.
          echo "$body" | grep -q '"ok":true'
